[project]
name = "agent"
version = "0.1.0"
description = "learning logs"
readme = "README_zh.md"
requires-python = ">=3.11"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.5",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "async-timeout==5.0.1",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "colorama==0.4.6",
    "distro==1.9.0",
    "exceptiongroup==1.3.1",
    "fastapi==0.141.1",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "jiter==0.16.0",
    "markdown-it-py==3.0.0",
    "mdurl==0.1.2",
    "multidict==6.7.1",
    "openai==2.48.0",
    "propcache==0.4.1",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings>=2.15.0",
    "pygments==2.20.0",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "rich==15.0.0",
    "sniffio==1.3.1",
    "starlette==1.6.0",
    "tqdm==4.70.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.3",
    "uvicorn==0.52.1",
    "yarl==1.22.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[project.scripts]
file-report = "file_report.main:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["file_report"]

[tool.ruff]
line-length = 100